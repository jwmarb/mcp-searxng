# For fully static binary: add musl target with `rustup target add x86_64-unknown-linux-musl`
# and build with: cargo build --release --target x86_64-unknown-linux-musl
# Or set default: target = "x86_64-unknown-linux-musl"

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
