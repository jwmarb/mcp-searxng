[project]
name = "mcp-searxng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "markdownify>=1.1.0",
    "mcp>=1.6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "starlette>=0.36.0",
    "uvicorn>=0.29.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real LLM endpoints (requires .env config)",
]
